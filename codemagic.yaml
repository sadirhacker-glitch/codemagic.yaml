workflows:
  android-build:
    name: Debug FocusFilter
    environment:
      java: 17
    scripts:
      - name: List all files
        script: |
          echo "=== Current directory ==="
          pwd
          echo "=== All files and folders ==="
          ls -la
          echo "=== Looking for archive files ==="
          find . -name "*.tar*" -o -name "*.gz*" -o -name "*.zip"
          echo "=== Looking for gradle files ==="
          find . -name "build.gradle" -o -name "settings.gradle"
