workflows:
  android-build:
    name: Build FocusFilter APK
    environment:
      java: 17
    scripts:
      - name: Unpack and build
        script: |
          echo "=== Unpacking archive ==="
          tar -xf FocusFilter_v4.tar.gz-6.tar
          echo "=== Contents after unpack ==="
          ls -la
          echo "=== Looking for project folder ==="
          cd FocusFilter
          echo "=== Generating gradlew ==="
          gradle wrapper
          chmod +x gradlew
          echo "=== Building APK ==="
          ./gradlew assembleDebug --stacktrace
    artifacts:
      - FocusFilter/app/build/outputs/apk/debug/*.apk
