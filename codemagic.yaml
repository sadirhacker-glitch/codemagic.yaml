workflows:
  android-build:
    name: Build FocusFilter APK
    environment:
      java: 17
    scripts:
      - name: Unpack and build with full log
        script: |
          tar -xf FocusFilter_v4.tar.gz-6.tar
          cd FocusFilter
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --info > full_log.txt 2>&1
          cat full_log.txt
    artifacts:
      - FocusFilter/full_log.txt
      - FocusFilter/app/build/outputs/apk/debug/*.apk
